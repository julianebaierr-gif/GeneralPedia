name: Auto Publish Articles and Tools

on:
  # Auto-posting temporarily paused upon user request.
  # To resume, uncomment the schedule section below.
  # schedule:
  #   - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Publisher and Rebuild Site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GENERALPEDIA_SHEET_WEBHOOK: ${{ secrets.GENERALPEDIA_SHEET_WEBHOOK }}
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          python auto_publisher.py
          python rebuild_full_theme.py
          python google_indexing.py

      - name: Commit and Push New Posts and Site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-published new article and triggered full site indexing (12-hour interval)"
            git push origin main
          fi
